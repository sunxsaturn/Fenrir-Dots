name: Fenrir Dots source publisher
on:
  push:
    branches:
      - main
    paths:
      - "fenrir-dots-source-0.3.0.part-*"
      - ".github/workflows/publish-dots.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify and publish source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          shopt -s nullglob
          parts=(fenrir-dots-source-0.3.0.part-*)
          test "${#parts[@]}" -eq 7
          for i in "${!parts[@]}"; do
            expected="fenrir-dots-source-0.3.0.part-$(printf '%02d' "$i")"
            test "${parts[$i]}" = "$expected"
          done
          cat "${parts[@]}" > "$tmp/source.b64"
          base64 --decode "$tmp/source.b64" > "$tmp/source.tar.xz"
          cd "$tmp"
          sha256sum -c "$GITHUB_WORKSPACE/.source-archive.sha256"
          xz --test source.tar.xz
          if tar -tJf source.tar.xz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path in source archive" >&2
            exit 1
          fi
          mkdir extracted
          tar -xJf source.tar.xz -C extracted --no-same-owner
          cd extracted
          test -f config/hypr/hyprland.lua
          test -x bin/fenrir-wallpaper
          test -x bin/fenrir-theme
          test -x bin/fenrir-record
          test -f apps/fenrir-settings/app.py
          test -f apps/fenrir-welcome/app.py
          test -f apps/sun-ai/server.py
          test -f tests/test_sun_ai.py
          bash -n bin/fenrir-settings bin/fenrir-welcome bin/fenrir-monitor bin/fenrir-record bin/sun-ai
          python -m compileall -q bin apps scripts tests
          python -c 'import json,tomllib; from pathlib import Path; tomllib.loads(Path("config/fenrir-settings.toml").read_text()); json.loads(Path("config/waybar/config.jsonc").read_text())'
          python -m unittest discover -s tests -v
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.py[co]' -delete
          cd "$GITHUB_WORKSPACE"
          cp -a "$tmp/extracted/." .
          rm -f "${parts[@]}" fenrir-dots-source-0.3.0.tar.gz fenrir-dots-source-0.3.0.tar.xz archive.b64 source.tar.gz source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Fenrir Settings and Welcome applications"
          git push
