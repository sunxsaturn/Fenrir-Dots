name: Release Fenrir Dots

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fenrir-dots-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        run: |
          version="$(tr -d '\n' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validate release source
        run: |
          bash -n bin/fenrir-doctor bin/fenrir-upgrade
          python -m compileall -q bin apps/fenrir-doctor scripts tests
          python -m unittest discover -s tests -v
          node --check apps/fenrir-doctor/assets/app.js

      - name: Build source archive and checksum
        run: |
          version="$(tr -d '\n' < VERSION)"
          mkdir -p release
          git archive --format=tar.gz --prefix="fenrir-dots-${version}/" "$GITHUB_SHA" > "release/fenrir-dots-${version}.tar.gz"
          sha256sum release/* > release/SHA256SUMS

      - name: Publish GitHub Release and version tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
