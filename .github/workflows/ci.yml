name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate shell entry points
        run: bash -n bin/fenrir-doctor bin/fenrir-upgrade
      - name: Validate Fenrir Doctor dashboard JavaScript
        run: node --check apps/fenrir-doctor/assets/app.js
      - name: Compile Python sources
        run: python -m compileall -q bin apps/fenrir-doctor scripts tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
