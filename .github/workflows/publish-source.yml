name: Expand Fenrir source archive
on:
  push:
    branches: [main]
    paths: ["fenrir-dots-source-0.3.0.part-*"]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble and expand source archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          : > "$tmp/archive.b64"
          shopt -s nullglob
          parts=(fenrir-dots-source-0.3.0.part-*)
          test "${#parts[@]}" -ge 2
          for part in "${parts[@]}"; do cat "$part" >> "$tmp/archive.b64"; done
          base64 -d "$tmp/archive.b64" > "$tmp/source.tar.xz"
          xz -t "$tmp/source.tar.xz"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp" --no-same-owner
          test -f "$tmp/config/hypr/hyprland.lua"
          test -f "$tmp/bin/fenrir-control-center"
          test -d "$tmp/apps/sun-ai"
          cp -a "$tmp/." .
          rm -f fenrir-dots-source-0.3.0.part-* fenrir-dots-source-0.3.0.tar.gz fenrir-dots-source-0.3.0.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: publish Fenrir desktop dotfiles"
          git push
