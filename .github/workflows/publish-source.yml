name: Publish and validate Fenrir Dots source
on:
  push:
    branches: [main]
    paths:
      - "fenrir-dots-source-0.3.0.part-*"
      - ".github/workflows/publish-source.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Assemble, verify and test source archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          shopt -s nullglob
          parts=(fenrir-dots-source-0.3.0.part-*)
          test "${#parts[@]}" -eq 7
          for i in "${!parts[@]}"; do
            expected="fenrir-dots-source-0.3.0.part-$(printf '%02d' "$i")"
            test "${parts[$i]}" = "$expected"
          done
          cat "${parts[@]}" > "$tmp/archive.b64"
          base64 --decode "$tmp/archive.b64" > "$tmp/source.tar.xz"
          expected_sha="$(awk '{print $1}' .source-archive.sha256)"
          actual_sha="$(sha256sum "$tmp/source.tar.xz" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          xz --test "$tmp/source.tar.xz"
          if tar -tJf "$tmp/source.tar.xz" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path detected in source archive" >&2
            exit 1
          fi
          mkdir "$tmp/unpack"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp/unpack" --no-same-owner
          test -f "$tmp/unpack/config/hypr/hyprland.lua"
          test -x "$tmp/unpack/bin/fenrir-wallpaper"
          test -x "$tmp/unpack/bin/fenrir-theme"
          test -x "$tmp/unpack/bin/fenrir-record"
          test -f "$tmp/unpack/apps/fenrir-settings/app.py"
          test -f "$tmp/unpack/apps/fenrir-welcome/app.py"
          test -f "$tmp/unpack/apps/sun-ai/server.py"
          test -f "$tmp/unpack/tests/test_sun_ai.py"
          (
            cd "$tmp/unpack"
            bash -n bin/fenrir-settings bin/fenrir-welcome bin/fenrir-monitor bin/fenrir-record bin/sun-ai
            python -m compileall -q bin apps scripts tests
            python -c 'import json,tomllib; from pathlib import Path; tomllib.loads(Path("config/fenrir-settings.toml").read_text(encoding="utf-8")); json.loads(Path("config/waybar/config.jsonc").read_text(encoding="utf-8"))'
            python -m unittest discover -s tests -v
          )
          # This runner token cannot push workflow files; publish the CI workflow separately.
          rm -f "$tmp/unpack/.github/workflows/ci.yml"
          find "$tmp/unpack" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$tmp/unpack" -type f -name '*.py[co]' -delete
          cp -a "$tmp/unpack/." .
          rm -f "${parts[@]}" fenrir-dots-source-0.3.0.tar.gz fenrir-dots-source-0.3.0.tar.xz archive.b64 source.tar.gz source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already matches the validated archive"
            exit 0
          fi
          git commit -m "feat: publish Fenrir Settings and Welcome applications"
          git push
