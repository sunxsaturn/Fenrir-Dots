[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fenrir-dots"
version = "0.17.1"
description = "Fenrir Hyprland desktop, adaptive theme and public wallpaper library"
requires-python = ">=3.13"
dependencies = ["Pillow>=11.0"]

[project.scripts]
fenrir-wallpaper = "fenrir_dots.cli:wallpaper_main"
fenrir-theme = "fenrir_dots.cli:theme_main"
fenrir-glass = "fenrir_dots.cli:glass_main"
fenrir-doctor = "fenrir_dots.doctor:main"
fenrir-control-center = "fenrir_dots.doctor:control_center_main"

[tool.setuptools.packages.find]
where = ["src"]
