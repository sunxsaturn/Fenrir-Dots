# Fenrir Desktop — Hyprland Wayland session
$mod = SUPER

monitor = ,preferred,auto,1
input {
  kb_layout = us
  kb_variant = intl
  follow_mouse = 1
  sensitivity = 0
}
general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  layout = dwindle
  col.active_border = rgba(9b87f5ff)
  col.inactive_border = rgba(343747aa)
}
decoration {
  rounding = 12
  active_opacity = 1.0
  inactive_opacity = 1.0
  blur {
    enabled = yes
    size = 10
    passes = 2
    xray = false
    ignore_opacity = true
  }
}
# Window contents stay fully opaque. Blur is applied only to transparent surfaces.
layerrule = blur, waybar
layerrule = blur, fuzzel
layerrule = blur, mako

$terminal = kitty
$launcher = fuzzel
$fileManager = thunar
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, E, exec, $fileManager
bind = $mod, L, exec, hyprlock
bind = $mod, Q, killactive
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, Q, exit
bind = $mod, W, exec, fenrir-wallpaper next
bind = $mod, A, exec, fenrir-doctor open

# Optional generated glass rules are managed by Fenrir Control Center.
source = ~/.config/hypr/fenrir-glass.conf
